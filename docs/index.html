<style>
:root{--bg:#F6F8FA;--card:#FFFFFF;--ink:#23272E;--muted:#5C6470;--line:#E4E9EF;--blue:#1D5E9E;--coral:#C43041}
@media (prefers-color-scheme: dark){:root{--bg:#191C21;--card:#22262D;--ink:#F0F2F5;--muted:#A6ADB8;--line:#343A44;--blue:#6FAEE8;--coral:#E8697A}}
*{margin:0;padding:0;box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:'Poppins',-apple-system,sans-serif;min-height:100vh;display:flex;align-items:center;justify-content:center;padding:20px}
.gate{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:38px 34px;max-width:400px;width:100%}
.kicker{font-size:12px;font-weight:700;letter-spacing:2px;text-transform:uppercase;color:var(--coral);margin-bottom:8px}
h1{font-size:22px;font-weight:700;margin-bottom:6px}
p{color:var(--muted);font-size:14px;margin-bottom:20px}
input{width:100%;font:400 15px 'Poppins',sans-serif;color:var(--ink);background:var(--bg);border:1px solid var(--line);border-radius:10px;padding:12px 14px;margin-bottom:12px}
input:focus{outline:2px solid var(--blue);outline-offset:1px}
button{width:100%;font:600 15px 'Poppins',sans-serif;color:#fff;background:var(--blue);border:0;border-radius:10px;padding:12px;cursor:pointer}
button:focus-visible{outline:2px solid var(--ink);outline-offset:2px}
.err{color:var(--coral);font-size:13px;margin-top:10px;display:none}
</style></head><body>

document.getElementById('f').addEventListener('submit',async e=>{
  e.preventDefault();
  const pw=document.getElementById('pw').value;
  try{
    const km=await crypto.subtle.importKey('raw',new TextEncoder().encode(pw),'PBKDF2',false,['deriveKey']);
    const key=await crypto.subtle.deriveKey({name:'PBKDF2',salt:b(D.salt),iterations:600000,hash:'SHA-256'},km,{name:'AES-GCM',length:256},false,['decrypt']);
